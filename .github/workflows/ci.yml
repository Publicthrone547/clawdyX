name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: GNU make on Windows
        if: runner.os == 'Windows'
        run: command -v make || choco install make -y --no-progress
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: type-check the other OSes
        run: |
          for os in darwin windows linux; do
            GOOS=$os CGO_ENABLED=0 go vet ./...
            (cd desktop && GOOS=$os CGO_ENABLED=0 go vet ./host)
          done
      - name: guards (wording, per-OS docs, version)
        run: make check-wording check-docs check-version

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # The app needs cgo on macOS and Linux (GTK 3 + WebKitGTK 4.1 there), not on Windows.
      CGO_ENABLED: ${{ matrix.os == 'windows-latest' && '0' || '1' }}
      GOFLAGS: ${{ matrix.os == 'ubuntu-24.04' && '-tags=gtk3' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: GNU make on Windows
        if: runner.os == 'Windows'
        run: command -v make || choco install make -y --no-progress
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev xvfb desktop-file-utils
      - name: frontend
        working-directory: desktop/frontend
        run: npm ci && npm run typecheck && npm test && npm run build
      - name: third-party notices up to date
        if: runner.os == 'Linux'
        working-directory: .
        run: make check-notices
      - name: vet and test
        working-directory: desktop
        run: go vet ./... && go test ./...
      - name: build the app
        working-directory: desktop
        run: go build -tags "production${{ runner.os == 'Linux' && ',gtk3' || '' }}" -trimpath -buildvcs=false -o "../bin/clawdyX${{ runner.os == 'Windows' && '.exe' || '' }}" .
      - name: start the Linux app for 5 seconds
        if: runner.os == 'Linux'
        run: xvfb-run -a timeout 5 bin/clawdyX || test $? -eq 124
      - name: Linux packages, the .deb installed and removed on the runner
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          desktop-file-validate desktop/build/linux/clawdyX.desktop
          make package-linux VERSION=0.0.0
          sudo apt-get install -y ./bin/release-0.0.0/clawdyx_0.0.0_amd64.deb
          clawdyx version
          test -x /usr/bin/clawdyX
          test -f /usr/share/icons/hicolor/256x256/apps/clawdyx.png
          sudo apt-get remove -y clawdyx
          tar -tzf bin/release-0.0.0/clawdyX-0.0.0-linux-amd64.tar.gz | grep -q 'clawdyX-0.0.0-linux-amd64/clawdyx$'
      - name: Windows camera helper (MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./desktop/helper/windows/build.ps1 -Out bin/clawdyx-camera.exe
          $out = & bin/clawdyx-camera.exe list
          Write-Host $out
          if (-not ($out | ConvertFrom-Json).ok) { throw "the helper's list failed" }
      - name: Windows installer (NSIS), installed and removed on the runner
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          $src = "bin/windows/clawdyX"
          New-Item -ItemType Directory -Force "$src/helpers" | Out-Null
          Copy-Item bin/clawdyX.exe $src/
          Copy-Item bin/clawdyx-camera.exe $src/helpers/
          go build -trimpath -o $src/helpers/clawdyx.exe ./cmd/clawdyx
          go build -trimpath -ldflags=-H=windowsgui -o $src/helpers/clawdyxw.exe ./cmd/clawdyxw
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, README.md $src/
          $env:PATH = "C:\Program Files (x86)\NSIS;" + $env:PATH
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress; $env:PATH = "C:\Program Files (x86)\NSIS;" + $env:PATH }
          makensis -V2 -DVERSION=0.0.0 "-DSRC=$(Resolve-Path $src)" "-DOUT=$PWD\bin\setup.exe" desktop/build/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Start-Process -Wait bin/setup.exe -ArgumentList "/S"
          $dir = "$env:LOCALAPPDATA\Programs\clawdyX"
          foreach ($f in "clawdyX.exe", "helpers\clawdyx.exe", "helpers\clawdyxw.exe", "helpers\clawdyx-camera.exe", "Uninstall.exe") {
            if (-not (Test-Path "$dir\$f")) { throw "missing $f" }
          }
          if (-not (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\clawdyX")) { throw "no uninstall entry" }
          & "$dir\helpers\clawdyx.exe" version
          Start-Process -Wait "$dir\Uninstall.exe" -ArgumentList "/S", "_?=$dir"
          if (Test-Path "$dir\clawdyX.exe") { throw "the uninstaller left clawdyX.exe" }
          if (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\clawdyX") { throw "the uninstall entry is still there" }

      - name: binaries for manual QA
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            bin/clawdyX*
            bin/setup.exe
            bin/clawdyx-camera.exe
            bin/release-0.0.0/
          if-no-files-found: warn
          retention-days: 7

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: no tokens or keys in the repository
        run: make check-secrets
      - name: no Claude attribution in the new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: sh scripts/check-attribution.sh

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: govulncheck (reported, not blocking)
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
