name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: type-check the other OSes
        run: |
          for os in darwin windows linux; do
            GOOS=$os CGO_ENABLED=0 go vet ./...
            (cd desktop && GOOS=$os CGO_ENABLED=0 go vet ./host)
          done

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # The app needs cgo on macOS and Linux (GTK 3 + WebKitGTK 4.1 there), not on Windows.
      CGO_ENABLED: ${{ matrix.os == 'windows-latest' && '0' || '1' }}
      GOFLAGS: ${{ matrix.os == 'ubuntu-24.04' && '-tags=gtk3' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev xvfb
      - name: frontend
        working-directory: desktop/frontend
        run: npm ci && npm run typecheck && npm test && npm run build
      - name: vet and test
        working-directory: desktop
        run: go vet ./... && go test ./...
      - name: build the app
        working-directory: desktop
        run: go build -tags "production${{ runner.os == 'Linux' && ',gtk3' || '' }}" -trimpath -buildvcs=false -o "../bin/clawdyX${{ runner.os == 'Windows' && '.exe' || '' }}" .
      - name: start the Linux app for 5 seconds
        if: runner.os == 'Linux'
        run: xvfb-run -a timeout 5 bin/clawdyX || test $? -eq 124
      - name: Windows camera helper (MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./desktop/helper/windows/build.ps1 -Out bin/clawdyx-camera.exe
          $out = & bin/clawdyx-camera.exe list
          Write-Host $out
          if (-not ($out | ConvertFrom-Json).ok) { throw "the helper's list failed" }

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: no tokens or keys in the repository
        run: make check-secrets
